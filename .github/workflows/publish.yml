name: Publish edition
 
# Started by whileyouwereoutnews.com when a scheduled run hands in a finished script.
# Downloads the latest pipeline from the website, makes the video, checks it, publishes and posts.
on:
  repository_dispatch:
    types: [edition]
 
concurrency:
  group: wywo-publish
  cancel-in-progress: false
 
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
      TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
      TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
      TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
      TUMBLR_BLOG: whileyouwereoutnews
      TUMBLR_BLOG_ES: wywoenespanol
      EDITION_JSON: ${{ toJson(github.event.client_payload.edition) }}
      KIND: ${{ github.event.client_payload.kind }}
      SLUG: ${{ github.event.client_payload.slug }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Oct 28 audit (Robbie "Deploy"): "Install tools" took up to 21 min (Oct 26 PM posted ~50 min late).
      # Cache pip + the Chromium download and the apt packages; fall back to a plain install if a cache step fails.
      - name: Cache Python packages and browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: wywo-tools-${{ runner.os }}-v1
      - name: Install system packages (cached)
        continue-on-error: true
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ffmpeg fonts-noto-color-emoji
          version: "1.0"
      - name: Install tools
        timeout-minutes: 25
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji)
          pip install -q playwright numpy soundfile kokoro-onnx pillow
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()" || python -m playwright install --with-deps chromium
      - name: Download the pipeline
        run: curl -sSf -A "wywo-actions" https://whileyouwereoutnews.com/pipeline/wywo-pipeline.tar.gz | tar xz
      - name: Write the script
        run: python -c "import os; open('edition.json','w').write(os.environ['EDITION_JSON'])"
      - name: Make and post
        working-directory: wywo-pipeline
        run: |
          if [ "$KIND" = "recap" ]; then python recap.py ../edition.json; else python run.py ../edition.json; fi
      - name: Report failure to the website
        if: failure()
        run: |
          curl -sS -X POST https://whileyouwereoutnews.com/api/relay/report \
            -H "x-relay-token: $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -A "wywo-actions" \
            -d "{\"slug\":\"$SLUG\",\"status\":\"failed\",\"log\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
 
